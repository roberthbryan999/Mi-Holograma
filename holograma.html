<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Holograma humano</title>
<style>
  :root { --cyan:#54f7ff; --blue:#168bff; --deep:#020812; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden;
    color:#d9fbff; font-family:Arial,Helvetica,sans-serif;
    background: radial-gradient(ellipse at 50% 44%, #092a48 0%, #041321 34%, #01050c 75%);
  }
  .scene { position:relative; width:min(100vw,900px); height:min(100vh,760px); min-height:570px; display:grid; place-items:center; isolation:isolate; }
  .stars, .stars:before, .stars:after { position:absolute; inset:0; content:""; pointer-events:none; }
  .stars { background-image:radial-gradient(1px 1px at 12% 22%,#9cfaff 98%,transparent),radial-gradient(1px 1px at 78% 18%,#9cfaff 98%,transparent),radial-gradient(1px 1px at 88% 68%,#9cfaff 98%,transparent),radial-gradient(1px 1px at 22% 77%,#9cfaff 98%,transparent),radial-gradient(2px 2px at 64% 82%,#58cfff 98%,transparent); opacity:.7; animation:twinkle 4s ease-in-out infinite alternate; }
  .stars:before { background:repeating-linear-gradient(0deg,transparent 0 42px,rgba(49,183,255,.035) 43px 44px); }
  .title { position:absolute; top:35px; text-align:center; letter-spacing:.35em; font-size:clamp(12px,2vw,17px); color:#9dfaff; text-shadow:0 0 12px #28dfff; }
  .subtitle { position:absolute; top:64px; font-size:10px; letter-spacing:.22em; color:#4b9ebd; }
  .holo { position:relative; width:min(78vw,510px); height:540px; display:grid; place-items:center; transform:translateY(-2px); }
  .aura { position:absolute; width:82%; height:78%; border-radius:50%; background:radial-gradient(ellipse,rgba(0,211,255,.17),rgba(0,107,255,.07) 42%,transparent 70%); filter:blur(18px); animation:breathe 3.5s ease-in-out infinite; }
  .face { position:relative; z-index:2; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 8px rgba(67,239,255,.85)) drop-shadow(0 0 25px rgba(0,151,255,.55)); animation:float 4s ease-in-out infinite; }
  .face .line { fill:rgba(12,151,198,.045); stroke:var(--cyan); stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
  .face .fine { fill:none; stroke:#40cfff; stroke-width:.8; opacity:.7; }
  .face .bright { fill:none; stroke:#c7ffff; stroke-width:1.2; opacity:.95; }
  .face .shade { fill:rgba(12,192,255,.08); stroke:#20baff; stroke-width:1; }
  .scan { position:absolute; z-index:4; inset:7% 12% 12%; pointer-events:none; background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(112,250,255,.13) 6px,transparent 7px); mix-blend-mode:screen; opacity:.55; animation:scan 5s linear infinite; mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent); }
  .glitch { position:absolute; z-index:5; inset:16% 14% 15%; pointer-events:none; background:linear-gradient(90deg,transparent 0 43%,rgba(85,255,255,.18) 48%,transparent 54%); opacity:0; animation:glitch 6s steps(1) infinite; }
  .ring { position:absolute; z-index:1; width:95%; height:19%; bottom:5%; border:1px solid rgba(65,230,255,.65); border-radius:50%; transform:rotateX(68deg); box-shadow:0 0 12px #00cfff,inset 0 0 14px rgba(0,201,255,.3); }
  .ring.two { width:75%; height:13%; bottom:8%; opacity:.6; animation:rotate 8s linear infinite; }
  .ring.three { width:110%; height:25%; bottom:1%; opacity:.3; animation:rotate 12s linear infinite reverse; }
  .beam { position:absolute; z-index:0; bottom:11%; width:65%; height:65%; background:linear-gradient(0deg,rgba(0,195,255,.18),transparent 85%); clip-path:polygon(43% 0,57% 0,100% 100%,0 100%); filter:blur(8px); }
  .base { position:absolute; bottom:22px; width:240px; height:18px; border-radius:50%; background:radial-gradient(ellipse,rgba(52,237,255,.55),rgba(0,116,255,.15) 48%,transparent 72%); filter:blur(5px); }
  .hud { position:absolute; bottom:28px; left:50%; transform:translateX(-50%); text-align:center; width:100%; color:#55a9c8; font-size:10px; letter-spacing:.2em; line-height:2; }
  .status { color:#9cffff; text-shadow:0 0 8px #00dfff; }
  .corner { position:absolute; width:42px; height:42px; border-color:rgba(71,218,255,.45); border-style:solid; }
  .tl{top:115px;left:7%;border-width:1px 0 0 1px}.tr{top:115px;right:7%;border-width:1px 1px 0 0}.bl{bottom:90px;left:7%;border-width:0 0 1px 1px}.br{bottom:90px;right:7%;border-width:0 1px 1px 0}
  @keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes breathe {0%,100%{transform:scale(.94);opacity:.65}50%{transform:scale(1.08);opacity:1}}
  @keyframes scan {from{transform:translateY(-15%)}to{transform:translateY(15%)}}
  @keyframes rotate {to{transform:rotateX(68deg) rotateZ(360deg)}}
  @keyframes twinkle {from{opacity:.35}to{opacity:.9}}
  @keyframes glitch {0%,91%,100%{opacity:0;transform:translateX(0)}92%{opacity:.8;transform:translateX(8px)}93%{opacity:.2;transform:translateX(-6px)}94%{opacity:0}}
  @media(max-height:650px){.scene{transform:scale(.82)} }
</style>
</head>
<body>
<main class="scene">
  <div class="stars"></div>
  <div class="title">PROYECCIÓN HOLOGRÁFICA</div>
  <div class="subtitle">SISTEMA DE VISUALIZACIÓN • INTERFAZ 01</div>
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  <section class="holo" aria-label="Rostro humano holográfico animado">
    <div class="aura"></div><div class="beam"></div>
    <svg class="face" viewBox="0 0 420 520" role="img" aria-label="Rostro humano formado por líneas luminosas">
      <defs>
        <clipPath id="headClip"><path d="M210 48 C130 48 91 111 94 207 L103 303 C110 386 153 435 210 451 C267 435 310 386 317 303 L326 207 C329 111 290 48 210 48Z"/></clipPath>
        <linearGradient id="faceFill" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#36eaff" stop-opacity=".13"/><stop offset="1" stop-color="#087bff" stop-opacity=".025"/></linearGradient>
      </defs>
      <!-- Silueta frontal y estructura facial -->
      <path class="shade" fill="url(#faceFill)" d="M210 48 C130 48 91 111 94 207 L103 303 C110 386 153 435 210 451 C267 435 310 386 317 303 L326 207 C329 111 290 48 210 48Z"/>
      <g clip-path="url(#headClip)">
        <path class="fine" d="M100 115 Q210 72 320 115 M94 145 Q210 102 326 145 M92 178 Q210 135 328 178 M95 215 Q210 174 325 215 M99 252 Q210 214 321 252 M103 290 Q210 255 317 290 M111 330 Q210 298 309 330 M126 368 Q210 343 294 368 M150 402 Q210 387 270 402"/>
        <path class="fine" d="M125 75 Q160 130 145 190 T155 330 M295 75 Q260 130 275 190 T265 330 M180 55 Q165 170 180 270 T190 430 M240 55 Q255 170 240 270 T230 430"/>
        <path class="fine" d="M110 190 Q150 165 190 190 M230 190 Q270 165 310 190 M112 230 Q150 210 190 230 M230 230 Q270 210 308 230"/>
      </g>
      <path class="line" d="M210 48 C130 48 91 111 94 207 L103 303 C110 386 153 435 210 451 C267 435 310 386 317 303 L326 207 C329 111 290 48 210 48Z"/>
      <!-- Orejas -->
      <path class="line" d="M96 220 C72 194 69 254 91 281 M324 220 C348 194 351 254 329 281"/>
      <path class="fine" d="M91 229 Q78 239 94 260 M329 229 Q342 239 326 260"/>
      <!-- Cejas y ojos -->
      <path class="bright" d="M128 191 Q158 171 190 190 M230 190 Q262 171 292 191"/>
      <path class="line" d="M126 218 Q157 194 191 218 Q159 242 126 218Z M229 218 Q263 194 294 218 Q261 242 229 218Z"/>
      <ellipse cx="159" cy="218" rx="7" ry="10" fill="#aaffff"><animate attributeName="ry" values="10;10;1;10" keyTimes="0;0.94;0.97;1" dur="5s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="261" cy="218" rx="7" ry="10" fill="#aaffff"><animate attributeName="ry" values="10;10;1;10" keyTimes="0;0.94;0.97;1" dur="5s" repeatCount="indefinite"/></ellipse>
      <path class="fine" d="M137 225 Q158 249 181 226 M239 226 Q262 249 283 225"/>
      <!-- Nariz -->
      <path class="line" d="M208 205 Q203 260 190 290 Q209 305 230 290"/>
      <path class="fine" d="M195 293 Q210 300 225 293 M201 278 Q210 283 219 278"/>
      <!-- Boca -->
      <path class="bright" d="M171 337 Q210 320 249 337 Q211 365 171 337Z"/>
      <path class="fine" d="M178 339 Q210 346 242 339"/>
      <!-- Mandíbula y cuello -->
      <path class="line" d="M147 397 Q148 449 133 480 M273 397 Q272 449 287 480 M133 480 Q210 507 287 480"/>
      <path class="fine" d="M168 423 Q210 446 252 423 M180 456 Q210 468 240 456"/>
      <!-- Malla técnica lateral -->
      <path class="fine" d="M80 145 L112 160 L80 175 M340 145 L308 160 L340 175 M78 310 L112 300 L84 330 M342 310 L308 300 L336 330"/>
      <circle cx="110" cy="160" r="3" fill="#b8ffff"/><circle cx="310" cy="160" r="3" fill="#b8ffff"/>
    </svg>
    <div class="scan"></div><div class="glitch"></div>
    <div class="ring"></div><div class="ring two"></div><div class="ring three"></div>
  </section>
  <div class="base"></div>
  <div class="hud"><span class="status">● HOLOGRAMA ACTIVO</span><br>ESCANEO FACIAL · PROYECCIÓN 3D SIMULADA</div>
</main>
<script>
  // Pequeñas partículas luminosas que flotan alrededor del rostro.
  const scene = document.querySelector('.scene');
  for (let i = 0; i < 34; i++) {
    const p = document.createElement('span');
    const x = Math.random() * 100, y = 16 + Math.random() * 72;
    p.style.cssText = `position:absolute;left:${x}%;top:${y}%;width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;border-radius:50%;background:#8dfaff;box-shadow:0 0 9px #16dfff;opacity:${.25+Math.random()*.65};pointer-events:none;animation:particle ${3+Math.random()*5}s ease-in-out ${Math.random()*-5}s infinite alternate;`;
    scene.appendChild(p);
  }
  const style = document.createElement('style');
  style.textContent = '@keyframes particle{from{transform:translate3d(0,0,0);opacity:.2}to{transform:translate3d(8px,-22px,0);opacity:.95}}';
  document.head.appendChild(style);
</script>
</body>
</html>
